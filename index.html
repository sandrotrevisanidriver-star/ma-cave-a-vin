<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Cave à Vin</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🍷 Ma Cave à Vin</h1>
<div class="stats" id="statsBox">
Chargement des statistiques...
</div>

<div class="historyBox" id="historyBox">
Chargement de l’historique...
</div>

<input type="text" class="search" id="search" placeholder="Rechercher un vin...">

<select id="caveSelect" onchange="applyFilters()">
<option value="">🏠 Toutes les caves</option>
</select>

<div class="actions">
<button onclick="suggestTonight()">🤖 Que boire ce soir ?</button>
</div>

<select id="mealSelect" onchange="suggestMeal()">
<option value="">🍽️ Choisir un repas...</option>
<option value="viande">Viande rouge / grillade</option>
<option value="poisson">Poisson / fruits de mer</option>
<option value="fromage">Fromage / raclette / fondue</option>
<option value="apero">Apéro</option>
<option value="italien">Pâtes / pizza</option>
<option value="dessert">Dessert</option>
</select>

<div class="actionBox" id="suggestionBox">
Choisis une cave, un repas ou demande une suggestion 🍷
</div>

<div class="filters">
<button onclick="filterWine('')">Tous</button>
<button onclick="filterWine('Rouge')">Rouges</button>
<button onclick="filterWine('Blanc')">Blancs</button>
<button onclick="filterWine('Champagne')">Champagnes</button>
<button onclick="filterWine('Suisse')">Suisses</button>
</div>

<div class="grid" id="wineList"></div>

<div class="modal" id="wineModal">
<div class="modal-content" id="modalContent"></div>
</div>

<script src="app.js"></script>

</body>
</html>
